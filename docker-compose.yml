version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: spyzier-postgres
    environment:
      POSTGRES_DB: spyzier
      POSTGRES_USER: spyzier
      POSTGRES_PASSWORD: spyzier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spyzier -d spyzier"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - spyzier-network

  redis:
    image: redis:7-alpine
    container_name: spyzier-redis
    command: redis-server --requirepass spyzier-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "spyzier-redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - spyzier-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spyzier-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spyzier
      SPRING_DATASOURCE_USERNAME: spyzier
      SPRING_DATASOURCE_PASSWORD: spyzier
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: spyzier-redis
      JWT_SECRET: spyzier-jwt-secret-key-change-in-production-min-256-bits
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - spyzier-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spyzier-frontend
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: http://backend:8080
      VITE_WS_URL: ws://backend:8080/ws
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spyzier-network

  prometheus:
    image: prom/prometheus:latest
    container_name: spyzier-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - spyzier-network

  grafana:
    image: grafana/grafana:latest
    container_name: spyzier-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_DOMAIN: localhost
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - spyzier-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  spyzier-network:
    driver: bridge
