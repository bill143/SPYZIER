apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: spyzier
  labels:
    app: spyzier-backend
    app.kubernetes.io/part-of: spyzier-fleet-monitoring
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/spyzier"
  SPRING_DATASOURCE_USERNAME: "spyzier"
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  SERVER_PORT: "8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spyzier-backend
  namespace: spyzier
  labels:
    app: spyzier-backend
    version: v1
    app.kubernetes.io/part-of: spyzier-fleet-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spyzier-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: spyzier-backend
        version: v1
        app.kubernetes.io/part-of: spyzier-fleet-monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          image: ghcr.io/spyzier/spyzier/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spyzier-secrets
                  key: DB_PASSWORD
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spyzier-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: spyzier-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

---
apiVersion: v1
kind: Service
metadata:
  name: spyzier-backend
  namespace: spyzier
  labels:
    app: spyzier-backend
    app.kubernetes.io/part-of: spyzier-fleet-monitoring
spec:
  type: ClusterIP
  selector:
    app: spyzier-backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
